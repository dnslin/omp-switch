[package]
name = "omp-switch"
version = "0.1.0"
description = "Safe structured editor for OMP configuration"
authors = ["OMP Switch contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "omp_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
webdriver = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
serde_json = "1.0.145"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
thiserror = "2.0.17"
parking_lot = "0.12.5"
fs4 = "1.1.0"
which = "8.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["fmt"] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-opener = "2.5.4"
atomic-write-file = "0.3.1"
same-file = "1.0.6"
sha2 = "0.10.9"
url = "2.5.8"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
libc = "0.2.189"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
cap-std = "4.0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
