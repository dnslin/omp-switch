[package]
name = "omp-switch"
version = "0.1.0"
description = "Safe structured editor for OMP configuration"
authors = ["OMP Switch contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "omp_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
serde_json = "1.0.145"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.17"
parking_lot = "0.12.5"
fs4 = "1.1.0"
which = "8.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["fmt"] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-opener = "2.5.4"
atomic-write-file = "0.3.1"
same-file = "1.0.6"
sha2 = "0.10.9"
url = "2.5.8"
cap-std = "4.0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
